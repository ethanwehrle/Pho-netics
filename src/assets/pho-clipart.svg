<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Shadow Gradient -->
    <radialGradient id="drop-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D3748" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#2D3748" stop-opacity="0" />
    </radialGradient>

    <!-- Bowl Outer Gradient -->
    <linearGradient id="bowl-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#EDF2F7" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Broth Gradient -->
    <linearGradient id="broth-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C07D33" />
      <stop offset="50%" stop-color="#A05A1C" />
      <stop offset="100%" stop-color="#7B3F00" />
    </linearGradient>

    <!-- Chopstick Gradient -->
    <linearGradient id="chopstick-wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D69E2E" />
      <stop offset="100%" stop-color="#B7791F" />
    </linearGradient>
  </defs>

  <!-- Ambient Base Shadow -->
  <ellipse cx="250" cy="440" rx="170" ry="25" fill="url(#drop-shadow)" />

  <!-- STEAM RAYS -->
  <g stroke="#E2E8F0" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.75">
    <path d="M 170 140 Q 150 100 175 60 T 160 10" />
    <path d="M 250 130 Q 275 90 250 50 T 265 10" />
    <path d="M 330 140 Q 310 100 335 60 T 320 10" />
  </g>

  <!-- BOWL BASE / FOOT -->
  <path d="M 190 400 L 310 400 A 10 10 0 0 1 320 415 L 305 430 A 10 10 0 0 1 295 435 L 205 435 A 10 10 0 0 1 195 430 L 180 415 A 10 10 0 0 1 190 400 Z" fill="#CBD5E0" stroke="#2D3748" stroke-width="7" stroke-linejoin="round" />

  <!-- BOWL BODY (Back Outer Rim to Bottom) -->
  <path d="M 60 220 C 60 380 140 410 250 410 C 360 410 440 380 440 220 Z" fill="url(#bowl-gradient)" stroke="#2D3748" stroke-width="8" stroke-linejoin="round" />

  <!-- BROTH (Top Interior Surface) -->
  <ellipse cx="250" cy="220" rx="180" ry="70" fill="url(#broth-gradient)" stroke="#2D3748" stroke-width="7" />

  <!-- RICE NOODLES -->
  <g fill="none" stroke="#FFFDF5" stroke-linecap="round">
    <path d="M 130 220 Q 180 260 240 230 T 340 220" stroke-width="12" />
    <path d="M 160 210 Q 210 250 280 225 T 370 210" stroke-width="10" />
    <path d="M 120 200 Q 170 240 230 215 T 310 210" stroke-width="11" />
    <path d="M 190 230 Q 250 270 310 240 T 360 225" stroke-width="10" />
    <!-- Shadows under top noodles for depth -->
    <path d="M 130 224 Q 180 264 240 234" stroke="#A05A1C" stroke-width="4" opacity="0.4" />
  </g>

  <!-- BEEF SLICES (Rare Beef / Tai) -->
  <g stroke="#2D3748" stroke-width="5" stroke-linejoin="round">
    <!-- Slice 1 -->
    <path d="M 130 190 C 110 210 120 240 150 245 C 180 250 200 230 190 200 C 180 180 150 185 130 190 Z" fill="#C53030" />
    <path d="M 135 198 Q 155 210 175 205" fill="none" stroke="#FEB2B2" stroke-width="4" stroke-linecap="round" />
    <path d="M 145 220 Q 165 228 180 218" fill="none" stroke="#FEB2B2" stroke-width="3" stroke-linecap="round" />

    <!-- Slice 2 -->
    <path d="M 180 210 C 170 235 190 260 220 255 C 250 250 255 225 240 205 C 220 190 195 195 180 210 Z" fill="#9B2C2C" />
    <path d="M 190 218 Q 210 235 235 225" fill="none" stroke="#FEB2B2" stroke-width="4" stroke-linecap="round" />

    <!-- Slice 3 -->
    <path d="M 140 230 C 130 250 150 270 175 265 C 200 260 205 245 190 230 C 175 220 150 220 140 230 Z" fill="#9B2C2C" />
    <path d="M 150 238 Q 170 250 185 245" fill="none" stroke="#FEB2B2" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- STAR ANISE & CINNAMON (Garnish / Broth Elements) -->
  <g fill="#4A2511" stroke="#2D3748" stroke-width="4" stroke-linejoin="round">
    <!-- Star Anise -->
    <path d="M 330 255 L 334 245 L 342 250 L 342 240 L 350 245 L 352 235 L 358 243 L 366 238 L 364 248 L 374 250 L 368 257 L 375 264 L 365 264 L 364 274 L 356 267 L 348 273 L 350 263 L 340 262 L 346 255 Z" />
    <circle cx="353" cy="254" r="3" fill="#ECC94B" stroke="none" />
  </g>

  <!-- BEAN SPROUTS -->
  <g stroke="#2D3748" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Sprout 1 -->
    <path d="M 320 200 Q 300 210 280 195" fill="none" stroke="#EDF2F7" stroke-width="7" />
    <path d="M 320 200 Q 300 210 280 195" fill="none" opacity="0.1" /> <!-- outline overlay -->
    <path d="M 322 200 C 328 198 332 203 327 207 Z" fill="#D69E2E" />

    <!-- Sprout 2 -->
    <path d="M 340 215 Q 310 225 295 210" fill="none" stroke="#EDF2F7" stroke-width="6" />
    <path d="M 343 214 C 348 210 353 216 347 220 Z" fill="#D69E2E" />

    <!-- Sprout 3 -->
    <path d="M 300 185 Q 280 175 270 190" fill="none" stroke="#EDF2F7" stroke-width="6" />
    <path d="M 302 184 C 308 180 310 188 304 190 Z" fill="#ECC94B" />
  </g>

  <!-- SLICED JALAPENO / CHILI -->
  <g stroke="#2D3748" stroke-width="4" stroke-linejoin="round">
    <!-- Pepper Ring 1 -->
    <ellipse cx="290" cy="240" rx="18" ry="12" fill="#38A169" />
    <ellipse cx="290" cy="240" rx="10" ry="6" fill="#A7F3D0" />
    <circle cx="286" cy="240" r="2" fill="#FAF089" stroke="none" />
    <circle cx="294" cy="239" r="2" fill="#FAF089" stroke="none" />

    <!-- Pepper Ring 2 -->
    <ellipse cx="315" cy="225" rx="16" ry="10" fill="#2G7A4C" transform="rotate(-15 315 225)" fill-opacity="0.9" />
    <ellipse cx="315" cy="225" rx="8" ry="5" transform="rotate(-15 315 225)" fill="#A7F3D0" />
    <circle cx="313" cy="225" r="1.5" fill="#FAF089" stroke="none" />
  </g>

  <!-- HERBS & SCALLIONS (Thai Basil & Chopped Green Onion) -->
  <g stroke="#2D3748" stroke-width="4" stroke-linejoin="round">
    <!-- Basil Leaf 1 -->
    <path d="M 230 165 C 200 150 180 170 205 190 C 230 210 250 180 230 165 Z" fill="#48BB78" />
    <path d="M 210 175 Q 220 180 230 178" fill="none" stroke="#2F855A" stroke-width="3" stroke-linecap="round" />

    <!-- Basil Leaf 2 -->
    <path d="M 250 175 C 230 150 270 140 275 165 C 280 190 260 190 250 175 Z" fill="#38A169" />
    <path d="M 255 165 Q 262 172 265 178" fill="none" stroke="#1C4532" stroke-width="3" stroke-linecap="round" />

    <!-- Chopped Scallion Rings scattered -->
    <ellipse cx="170" cy="210" rx="7" ry="4" fill="#68D391" />
    <ellipse cx="220" cy="240" rx="8" ry="5" fill="#9AE6B4" />
    <ellipse cx="260" cy="215" rx="6" ry="4" fill="#68D391" />
    <ellipse cx="200" cy="195" rx="9" ry="5" fill="#9AE6B4" />
    <ellipse cx="325" cy="190" rx="7" ry="4" fill="#48BB78" />
    <ellipse cx="150" cy="235" rx="8" ry="4" fill="#68D391" />
  </g>

  <!-- SLICED ONION STRIPS (White Onion) -->
  <g fill="none" stroke="#EDF2F7" stroke-width="5" stroke-linecap="round" opacity="0.9">
    <path d="M 210 210 Q 230 190 255 205" />
    <path d="M 170 225 Q 190 205 210 230" />
    <path d="M 270 200 Q 285 185 300 205" />
  </g>

  <!-- CHOPSTICKS & SOUP SPOON -->
  <!-- Asian Soup Spoon -->
  <g stroke="#2D3748" stroke-width="6" stroke-linejoin="round">
    <!-- Spoon Handle -->
    <path d="M 120 160 Q 90 120 60 80 A 8 8 0 0 1 72 70 L 105 115 Q 135 150 145 170 Z" fill="#EDF2F7" />
    <!-- Spoon Bowl Inside Broth -->
    <path d="M 115 170 C 95 165 85 185 100 205 C 115 225 145 220 150 195 C 155 170 135 175 115 170 Z" fill="#E2E8F0" />
    <path d="M 105 178 C 98 175 95 188 105 198 C 115 208 132 205 135 192 Z" fill="#A05A1C" opacity="0.8" /> <!-- Broth in spoon -->
  </g>

  <!-- Pair of Chopsticks resting across the bowl -->
  <g stroke="#2D3748" stroke-width="5" stroke-linecap="round">
    <!-- Back Chopstick -->
    <path d="M 70 205 L 430 135" stroke-width="9" stroke="url(#chopstick-wood)" />
    <path d="M 70 205 L 430 135" stroke-width="9" stroke="#2D3748" fill="none" opacity="0.1" />
    <!-- Tip highlight/shadow -->
    <path d="M 410 138 L 430 135" stroke="#ECC94B" stroke-width="7" />

    <!-- Front Chopstick -->
    <path d="M 80 220 L 440 145" stroke-width="9" stroke="url(#chopstick-wood)" />
    <!-- Tip highlight/shadow -->
    <path d="M 420 148 L 440 145" stroke="#ECC94B" stroke-width="7" />
  </g>

  <!-- BOWL RIM (Front Overlay for Depth) -->
  <path d="M 60 220 C 60 290 140 310 250 310 C 360 310 440 290 440 220" fill="none" stroke="#2D3748" stroke-width="8" stroke-linecap="round" />
        
  <path d="M 64 220 C 64 284 142 304 250 304 C 358 304 436 284 436 220" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.8" />

  <!-- BOWL HIGHLIGHT (Clip-art Gloss Effect) -->
  <path d="M 100 250 C 90 320 140 375 210 395 C 190 380 170 350 165 310 C 160 270 175 245 175 245 C 175 245 110 230 100 250 Z" fill="#FFFFFF" opacity="0.4" />

  <!-- BOWL ACCENT STRIPE (Decorative Rim Line) -->
  <path d="M 85 245 C 120 275 180 290 250 290 C 320 290 380 275 415 245" fill="none" stroke="#3182CE" stroke-width="5" stroke-linecap="round" />
</svg>